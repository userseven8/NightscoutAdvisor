name: CI — Swift Tests & iOS/watchOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test NightscoutAdvisorKit & Build Targets
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run NightscoutAdvisorKit Unit Tests & CLI Smoke Check
        working-directory: Packages/NightscoutAdvisorKit
        run: |
          swift test
          swift run -c release advisor-cli --demo > /dev/null

      - name: Build iOS + watchOS + Complications (Unsigned Simulator)
        run: |
          xcodebuild \
            -project NightscoutAdvisor.xcodeproj \
            -scheme NightscoutAdvisor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Native macOS App + Menu Bar Target
        run: |
          xcodebuild \
            -project NightscoutAdvisor.xcodeproj \
            -scheme NightscoutAdvisorMac \
            -destination 'platform=macOS,arch=arm64' \
            build
